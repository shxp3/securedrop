; SecureDrop - Main Controller (ESP32 DevKit V1)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ ^4.4.17
    witnessmenow/UniversalTelegramBot @ ^1.3.0
    bblanchon/ArduinoJson @ ^6.21.5
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit SSD1306 @ ^2.5.10
    adafruit/Adafruit GFX Library @ ^1.11.9

; ใช้ partition scheme ขนาดใหญ่กว่า default (no OTA) เพราะไลบรารี Firebase+SSL
; กินพื้นที่ flash มาก (default partition ใช้ไปแล้ว ~99%) ให้เหลือที่สำหรับโค้ดที่จะเพิ่มในอนาคต
board_build.partitions = huge_app.csv

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D FIREBASE_DISABLE_ONBOARD_WIFI_CLOCK=0
