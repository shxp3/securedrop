; SecureDrop v1 - ESP32-CAM (AI-Thinker) — courier face capture
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
    -D CAMERA_MODEL_AI_THINKER
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3

board_build.partitions = huge_app.csv
